minimumReleaseAgeExclude:
  - '@valaxyjs/devtools@1.1.0'
  - '@valaxyjs/utils@1.1.0'
  - valaxy-theme-yun@1.1.0
  - valaxy@1.1.0
  - valaxy-addon-girls@0.1.0
  - eslint@10.9.1
shamefullyHoist: true
shellEmulator: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - valaxy-addon-algolia@0.2.1
  - valaxy-addon-components@0.1.0
  - valaxy-addon-waline@0.2.1
packages:
  - .
# Align Vite DevTools plugins with the Devframe 1.2.0 used by Valaxy DevTools.
overrides:
  '@vitejs/devtools@0.7.5>@devframes/hub-ui': 1.2.0
  '@vitejs/devtools@0.7.5>@devframes/json-render-ui': 1.2.0
  '@vitejs/devtools@0.7.5>@devframes/plugin-inspect': 1.2.0
  '@vitejs/devtools@0.7.5>@devframes/plugin-messages': 1.2.0
  '@vitejs/devtools@0.7.5>@devframes/plugin-terminals': 1.2.0
  # Keep older indirect and auto-installed peer dependencies on patched versions.
  axios@>=1 <1.20.0: ^1.20.0
  brace-expansion@>=5 <5.0.12: ^5.0.12
  rollup@>=4 <4.59.0: ^4.64.0
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - simple-git-hooks
  - vue-demi
