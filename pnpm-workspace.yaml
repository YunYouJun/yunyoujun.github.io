minimumReleaseAgeExclude:
  - '@valaxyjs/devtools@1.0.0-rc.1'
  - '@valaxyjs/utils@1.0.0-rc.1'
  - valaxy-theme-yun@1.0.0-rc.1
  - valaxy@1.0.0-rc.1
shamefullyHoist: true
shellEmulator: true
trustLockfile: true
trustPolicy: no-downgrade
packages:
  - .
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - simple-git-hooks
  - vue-demi
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
