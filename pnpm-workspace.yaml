minimumReleaseAgeExclude:
  - '@valaxyjs/devtools@1.5.1'
  - '@valaxyjs/utils@1.5.1'
  - valaxy-theme-yun@1.5.1
  - valaxy@1.5.1
  - valaxy-addon-girls@0.1.0
  - eslint@10.9.1
shamefullyHoist: true
shellEmulator: true
trustLockfile: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - valaxy-addon-components@0.1.0
  - valaxy-addon-waline@0.2.1
packages:
  - .
overrides:
  # Keep older indirect and auto-installed peer dependencies on patched versions.
  axios@>=1 <1.20.0: ^1.20.0
  brace-expansion@>=5 <5.0.12: ^5.0.12
  rollup@>=4 <4.59.0: ^4.64.0
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
